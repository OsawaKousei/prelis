name: prelis-lp

services:
  frontend:
    container_name: prelis-lp
    image: prelis-lp-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/app:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  node_modules:
